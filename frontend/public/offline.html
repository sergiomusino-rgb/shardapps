<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sei offline — ShardApps</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #020617; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    padding: 24px; text-align: center;
  }
  .card { max-width: 360px; }
  .icon {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
    background: linear-gradient(135deg, #4f46e5, #c026d3);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin: 0 0 20px; }
  button {
    background: linear-gradient(90deg, #4f46e5, #c026d3); color: white; border: none;
    padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Nessuna connessione</h1>
    <p>Questa pagina non è ancora stata salvata per l'uso offline. Ricontrolla la tua connessione e riprova — le pagine già visitate restano disponibili anche offline.</p>
    <button onclick="location.reload()">Riprova</button>
  </div>
</body>
</html>
