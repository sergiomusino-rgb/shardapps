services:
  - type: web
    name: zeusx-backend
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    # Il controllo RLS blocca il deploy se le policy sul database non
    # combaciano col contratto atteso (vedi scripts/check_rls_policies.js e
    # .github/workflows/rls-check.yml) — nato dall'audit del 2026-08-08,
    # dove 4 vulnerabilita' critiche sono passate inosservate per mesi
    # perche' create a mano su Supabase Dashboard, mai tracciate in una
    # migrazione. Richiede che SUPABASE_URL/SUPABASE_SERVICE_ROLE_KEY (gia'
    # configurate sotto) siano disponibili in fase di build, non solo a
    # runtime — comportamento di default su Render per gli env var di un
    # servizio.
    buildCommand: npm install && node scripts/check_rls_policies.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://zeusxapps.com,https://www.zeusxapps.com,https://zeusx.app,https://www.zeusx.app,https://zeusx-zwu8.vercel.app
      - key: APP_URL
        value: https://zeusxapps.com
      - key: FRONTEND_URL
        value: https://zeusxapps.com
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
